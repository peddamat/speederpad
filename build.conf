# Speeder Pad custom image build configuration.
#
# Every setting uses ": ${VAR:=default}", so any value can be overridden from
# the environment without editing this file, e.g.:
#   sudo SUITE=bullseye INSTANCES=3 ./build.sh
# Relative paths are resolved against the repository root.

# --- Input / output ---------------------------------------------------------
# FLSUN's stock restore image (.img or .img.xz). Its boot chain, kernel and
# Wi-Fi firmware are reused; nothing vendor-owned is stored in this repo.
: "${STOCK_IMAGE:=SPEEDERPADPADV1.2V2_TFCARD-230303.img.xz}"
: "${WORK_DIR:=work}"
: "${OUT_DIR:=out}"
: "${IMAGE_NAME:=speederpad-klipper-$(date +%Y%m%d)}"
# 1 = write out/<name>.img.xz (Raspberry Pi Imager accepts it directly).
: "${COMPRESS:=1}"

# --- Base OS -----------------------------------------------------------------
# The vendor kernel is Linux 4.9 (arm64, with 32-bit compat). bookworm
# (systemd 252) is the default; bullseye (systemd 247) is the conservative
# fallback if bookworm misbehaves on the old kernel.
: "${SUITE:=bookworm}"
: "${ARCH:=arm64}"
: "${MIRROR:=http://deb.debian.org/debian}"
: "${SECURITY_MIRROR:=http://security.debian.org/debian-security}"
# Keyring used to verify the Debian archive. Empty = the host's keyring on a
# Debian host; on other hosts (Ubuntu, WSL) the current debian-archive-keyring
# package is downloaded over HTTPS from deb.debian.org, because older copies
# (e.g. Ubuntu 24.04's 2023.4) lack Debian's current signing keys.
: "${DEBIAN_KEYRING:=}"

: "${HOSTNAME_PAD:=speeder-pad}"
: "${USERNAME:=pi}"
# Stock image uses pi/flsun. Change this before sharing an image.
: "${PASSWORD:=flsun}"
: "${TIMEZONE:=Etc/UTC}"
: "${LOCALE:=en_US.UTF-8}"

# Optional Wi-Fi network baked into the image (the PSK is stored in the image).
: "${WIFI_SSID:=}"
: "${WIFI_PSK:=}"

# --- Klipper stack -----------------------------------------------------------
# Number of Klipper/Moonraker instance pairs. 1 = klipper.service +
# moonraker.service on port 7125 with ~/printer_data. N > 1 = klipper-N /
# moonraker-N, ports 7125.., ~/printer_N_data (KIAUH layout).
: "${INSTANCES:=1}"
# Import printer_N/*.cfg from the stock image into the matching instance.
: "${IMPORT_STOCK_CONFIG:=1}"

: "${KLIPPER_REPO:=https://github.com/Klipper3d/klipper.git}"
: "${KLIPPER_REF:=master}"
: "${MOONRAKER_REPO:=https://github.com/Arksine/moonraker.git}"
: "${MOONRAKER_REF:=master}"
: "${KLIPPERSCREEN_REPO:=https://github.com/KlipperScreen/KlipperScreen.git}"
: "${KLIPPERSCREEN_REF:=master}"
# "latest" or a release tag such as v2.14.0
: "${MAINSAIL_VERSION:=latest}"

: "${INSTALL_CROWSNEST:=1}"
: "${CROWSNEST_REPO:=https://github.com/mainsail-crew/crowsnest.git}"
: "${CROWSNEST_REF:=master}"

: "${INSTALL_TIMELAPSE:=1}"
: "${TIMELAPSE_REPO:=https://github.com/mainsail-crew/moonraker-timelapse.git}"
: "${TIMELAPSE_REF:=main}"

# Toolchains so MCU firmware (e.g. the V400's STM32F103) can be built on the pad.
: "${INSTALL_MCU_TOOLCHAIN:=1}"

# --- Image -------------------------------------------------------------------
# Free space left in rootfs.fex; the first boot grows the filesystem to the
# whole eMMC rootfs partition (~14.5 GiB) anyway.
: "${ROOTFS_EXTRA_MB:=512}"
# Card image size in 512-byte sectors; empty = smallest valid size.
: "${CARD_TOTAL_SECTORS:=}"
