# Placeholder written by the Speeder Pad image build because no stock
# printer config was imported. Upload your printer.cfg in Mainsail
# (Machine tab) and restart Klipper.
#
# FLSUN V400 reference config:
#   https://github.com/Flsun3d/Flsun_Speeder_Pad/blob/main/firmware/V400/printer.cfg
# The V400 board appears on the pad's USB port as:
#   /dev/serial/by-path/platform-5200000.ehci1-controller-usb-0:1.4:1.0-port0

[mcu]
serial: /dev/serial/by-path/platform-5200000.ehci1-controller-usb-0:1.4:1.0-port0

[printer]
kinematics: none
max_velocity: 1
max_accel: 1
