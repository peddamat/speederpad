# Stock-compatible G-code for the FLSUN Speeder Pad.
#
# FLSUN's Klipper fork changed how M109/M190 wait and added M205. These macros
# recreate that behaviour on current Klipper. Remove the
# [include stock-compat.cfg] line from printer.cfg to get upstream behaviour.

# FLSUN's Klipper counts a heater as at temperature once it is within 3 C of
# the target, without waiting for it to settle (upstream: within 1 C and
# stable). Adjust variable_tolerance to taste. R is accepted like S.
[gcode_macro M109]
description: Set hotend temperature and wait until within tolerance
rename_existing: M99109
variable_tolerance: 3.0
gcode:
  {% set s = (params.S|default(params.R|default(0)))|float %}
  {% if 'T' in params %}
    {% set t = params.T|int %}
    {% set sensor = "extruder" if t == 0 else "extruder%d" % t %}
    M104 T{t} S{s}
  {% else %}
    {% set sensor = printer.toolhead.extruder %}
    M104 S{s}
  {% endif %}
  {% if s > 0 %}
    TEMPERATURE_WAIT SENSOR={sensor} MINIMUM={s - tolerance} MAXIMUM={s + tolerance}
  {% endif %}

[gcode_macro M190]
description: Set bed temperature and wait until within tolerance
rename_existing: M99190
variable_tolerance: 3.0
gcode:
  {% set s = (params.S|default(params.R|default(0)))|float %}
  M140 S{s}
  {% if s > 0 %}
    TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={s - tolerance} MAXIMUM={s + tolerance}
  {% endif %}

# FLSUN's Klipper took slicer "jerk" (M205 X<n>) as square_corner_velocity.
# Other M205 parameters are ignored, as in the stock firmware.
[gcode_macro M205]
description: Set square_corner_velocity from slicer jerk (M205 X)
gcode:
  {% if 'X' in params and params.X|float > 0 %}
    SET_VELOCITY_LIMIT SQUARE_CORNER_VELOCITY={params.X|float}
  {% endif %}
